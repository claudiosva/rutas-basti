function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
}

const map = L.map('map', {scrollWheelZoom: false});
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 19,
  attribution: 'Mapa base &copy; Esri, HERE, Garmin, &copy; colaboradores de OpenStreetMap'
}).addTo(map);
const capa = L.featureGroup().addTo(map);

function mostrarDia(clave) {
  const d = DATA[clave];
  document.documentElement.style.setProperty('--c', d.color);
  document.querySelectorAll('#dias button').forEach(b => b.classList.toggle('activo', b.dataset.dia === clave));
  document.getElementById('resumen').innerHTML =
    `Inicio <b>${d.inicio}</b> · Término <b>${d.fin}</b> · ${d.traslado_min} min en traslados`;

  capa.clearLayers();
  for (const t of d.tramos) {
    L.polyline(t.coords, {color: d.color, weight: 5, opacity: 0.8, dashArray: t.real ? null : '6 8'}).addTo(capa);
  }
  for (const p of d.paradas) {
    const icon = L.divIcon({className: '', iconSize: null,
                            html: `<div class="stop" style="background:${d.color}">${p.pasos.join('·')}</div>`});
    L.marker([p.lat, p.lon], {icon}).bindPopup(p.nombres.map(esc).join('<br>')).addTo(capa);
  }
  map.fitBounds(capa.getBounds(), {padding: [30, 30]});

  const n = d.itinerario.length;
  document.getElementById('lista').innerHTML = d.itinerario.map((s, i) => {
    let html = `<div class="tarjeta"><div class="hora"><span class="num">${s.paso}</span>${esc(s.horario)}</div>` +
               `<div class="nombre">${esc(s.nombre)} <span class="cod">${esc(s.cod)}</span></div>` +
               `<div class="dir">${esc(s.direccion)}</div></div>`;
    if (i < n - 1) {
      html += `<div class="traslado">↓ ${esc(s.traslado)}</div>`;
      html += s.nav_url
        ? `<a class="boton" href="${esc(s.nav_url)}" target="_blank" rel="noopener">Cómo llegar al paso ${s.paso + 1} ›</a>`
        : '<div class="separador"></div>';
    }
    return html;
  }).join('') + `<div class="fin">Fin de la jornada: ${d.fin}</div>`;
}

const nav = document.getElementById('dias');
for (const [clave, d] of Object.entries(DATA)) {
  const b = document.createElement('button');
  b.textContent = d.titulo;
  b.dataset.dia = clave;
  b.style.setProperty('--b', d.color);
  b.onclick = () => mostrarDia(clave);
  nav.appendChild(b);
}

// Abre en el día de hoy (domingo: lunes).
const claves = Object.keys(DATA);
const hoy = new Date().getDay();
mostrarDia(claves[hoy >= 1 && hoy <= claves.length ? hoy - 1 : 0]);
</script>
